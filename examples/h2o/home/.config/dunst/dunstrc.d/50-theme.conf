# h2o: dunst's colours, a drop-in dunst reads after its dunstrc.
[global]
    frame_color = "#3fa9f5"

[urgency_low]
    background = "#0b1826"
    foreground = "#8eabc4"
    frame_color = "#1f3a52"

[urgency_normal]
    background = "#0b1826"
    foreground = "#dde9f3"

[urgency_critical]
    background = "#2a1418"
    foreground = "#dde9f3"
    frame_color = "#f2707a"
