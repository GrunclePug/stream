# h2o: the tmux status line and pane borders. Add
# source-file -q ~/.config/tmux/theme.conf to tmux.conf.
set -g status-style "bg=#132536,fg=#e6f1fa"
set -g window-status-current-style "bg=#3fa9f5,fg=#0b1826,bold"
set -g message-style "bg=#132536,fg=#3fa9f5"
set -g pane-border-style "fg=#1f3a52"
set -g pane-active-border-style "fg=#3fa9f5"
set -g mode-style "bg=#3fa9f5,fg=#0b1826"
